<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flipkart Accounts Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="data.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2233;--mut:#6b7385;--line:#e3e7ef;--pri:#2874f0;--acc:#f7b500;--bad:#d64545;--ok:#1f9d55}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#191e28;--ink:#e8ebf2;--mut:#98a0b3;--line:#2a3140;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131a;--card:#191e28;--ink:#e8ebf2;--mut:#98a0b3;--line:#2a3140;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:20px}header small{opacity:.85}
.bar{display:flex;flex-wrap:wrap;gap:8px}select,input{padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
main{padding:16px;max-width:1300px;margin:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.k,.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.k b{display:block;font-size:22px;margin-top:4px}.k span{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600}.tw{overflow-x:auto}
.warn{background:#fff4d6;color:#6b4e00;padding:10px;border-radius:8px;margin-bottom:12px}.bad{color:var(--bad)}.ok{color:var(--ok)}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div><h1>Flipkart Accounts Dashboard</h1><small id="gen"></small></div>
<div class="bar"><select id="fAcc"></select><input type="date" id="fFrom"><input type="date" id="fTo"></div></header>
<main>
<div id="note"></div>
<div class="kpis" id="kpis"></div>
<div class="grid"><div class="card"><h3>Daily Sales (₹)</h3><canvas id="cTrend"></canvas></div>
<div class="card"><h3>Account-wise Sales (₹)</h3><canvas id="cAcc"></canvas></div></div>
<div class="grid"><div class="card"><h3>Account Comparison</h3><div class="tw"><table id="tAcc"></table></div></div>
<div class="card"><h3>Order Status</h3><canvas id="cStatus"></canvas></div></div>
<div class="grid"><div class="card"><h3>Top Selling SKUs</h3><div class="tw"><table id="tTop"></table></div></div>
<div class="card"><h3>Most Returned SKUs</h3><div class="tw"><table id="tRet"></table></div></div></div>
<div class="grid"><div class="card"><h3>Return Reasons</h3><canvas id="cReason"></canvas></div>
<div class="card"><h3>API Status</h3><div class="tw"><table id="tApi"></table></div></div></div>
<section id="settle" hidden>
<h2 style="font-size:18px;margin:24px 0 4px">Bank Settlement &amp; Return Charges</h2>
<p style="color:var(--mut);margin:0 0 12px;font-size:13px" id="sNote"></p>
<div class="kpis" id="sKpis"></div>
<div class="grid"><div class="card"><h3>Bank Credits by Date (₹)</h3><canvas id="cBank"></canvas></div>
<div class="card"><h3>Account-wise Settlement</h3><div class="tw"><table id="tSet"></table></div></div></div>
<div class="grid"><div class="card"><h3>SKUs with Highest Return Charges</h3><div class="tw"><table id="tLoss"></table></div></div></div>
</section>
</main>
<script src="settle.js"></script>
<script>
let D = window.FK_DATA, demo = false;
if (!D) { demo = true; D = makeDemo(); }
const short = a => String(a).replace(/^Acc\d+_/, '').toUpperCase();
const $ = id => document.getElementById(id), inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
$('gen').textContent = (demo ? 'DEMO DATA — ' : 'Updated: ') + D.generated;
if (demo) $('note').innerHTML = '<div class="warn">Abhi demo data dikh raha hai. accounts.csv bhar ke RUN.bat chalaiye.</div>';
const accs = [...new Set(D.orders.map(o => o.acc).concat(D.status.map(s => s.acc), Object.keys(window.FK_SETTLE || {})))].sort();
$('fAcc').innerHTML = '<option value="">All Accounts</option>' + accs.map(a => `<option value="${a}">${short(a)}</option>`).join('');
const dates = D.orders.map(o => o.date).sort(); $('fFrom').value = dates[0] || ''; $('fTo').value = dates.at(-1) || '';
['fAcc','fFrom','fTo'].forEach(i => $(i).onchange = render);
const charts = {};
function chart(id, cfg) { charts[id]?.destroy(); charts[id] = new Chart($(id), cfg); }
const isCancel = o => /CANCEL/i.test(o.status || "");
const isLost = o => /CANCEL|^RETURNED$/i.test(o.status || "");
function grp(arr, key, val) { const m = {}; arr.forEach(x => { const k = typeof key == 'function' ? key(x) : x[key] || '—'; m[k] = (m[k] || 0) + (val ? val(x) : 1); }); return m; }
function render() {
  const a = $('fAcc').value, f = $('fFrom').value, t = $('fTo').value;
  const inR = x => (!a || x.acc === a) && (!f || x.date >= f) && (!t || x.date <= t);
  const O = D.orders.filter(inR), R = D.returns.filter(inR), live = O.filter(o => !isLost(o));
  const sales = live.reduce((s, o) => s + o.amount, 0), units = live.reduce((s, o) => s + o.qty, 0);
  const orderCount = new Set(O.map(o => o.orderId)).size, canc = O.filter(isCancel).length;
  const cust = R.filter(r => r.type === 'customer_return').length, rto = R.filter(r => r.type === 'courier_return').length;
  const k = [['Total Sales', inr(sales)], ['Orders', orderCount], ['Units Sold', units], ['Avg Order Value', inr(live.length ? sales / new Set(live.map(o => o.orderId)).size : 0)],
    ['Cancelled', canc], ['Customer Returns', cust], ['RTO (Courier)', rto], ['Return Rate', (units ? ((cust + rto) / units * 100).toFixed(1) : 0) + '%']];
  $('kpis').innerHTML = k.map(([l, v]) => `<div class="k"><span>${l}</span><b>${v}</b></div>`).join('');
  const byDay = grp(live, 'date', o => o.amount), days = Object.keys(byDay).sort();
  chart('cTrend', { type: 'line', data: { labels: days, datasets: [{ label: 'Sales', data: days.map(d => byDay[d]), borderColor: '#2874f0', backgroundColor: '#2874f022', fill: true, tension: .3 }] }, options: { plugins: { legend: { display: false } } } });
  const allO = D.orders.filter(o => (!f || o.date >= f) && (!t || o.date <= t)), allR = D.returns.filter(r => (!f || r.date >= f) && (!t || r.date <= t));
  const rows = accs.map(ac => { const o = allO.filter(x => x.acc === ac), l = o.filter(x => !isLost(x)), r = allR.filter(x => x.acc === ac), u = l.reduce((s, x) => s + x.qty, 0);
    return { ac, s: l.reduce((s, x) => s + x.amount, 0), n: new Set(o.map(x => x.orderId)).size, c: o.filter(isCancel).length, r: r.length, rr: u ? r.length / u * 100 : 0 }; }).sort((x, y) => y.s - x.s);
  chart('cAcc', { type: 'bar', data: { labels: rows.map(r => short(r.ac)), datasets: [{ data: rows.map(r => r.s), backgroundColor: '#2874f0' }] },
    options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { autoSkip: false, maxRotation: 45, minRotation: 0, font: { size: 11, weight: 'bold' } } } } } });
  $('tAcc').innerHTML = '<tr><th>Account</th><th>Sales</th><th>Orders</th><th>Cancel</th><th>Returns</th><th>Ret %</th></tr>' +
    rows.map(r => `<tr><td>${short(r.ac)}</td><td>${inr(r.s)}</td><td>${r.n}</td><td>${r.c}</td><td>${r.r}</td><td class="${r.rr > 15 ? 'bad' : ''}">${r.rr.toFixed(1)}%</td></tr>`).join('');
  const st = grp(O, 'status');
  chart('cStatus', { type: 'doughnut', data: { labels: Object.keys(st), datasets: [{ data: Object.values(st), backgroundColor: ['#2874f0','#1f9d55','#f7b500','#d64545','#8a5cf6','#14b8a6','#f97316'] }] } });
  const top = grp(live, o => o.sku, o => o.qty), topS = grp(live, o => o.sku, o => o.amount);
  $('tTop').innerHTML = '<tr><th>SKU</th><th>Units</th><th>Sales</th></tr>' + Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([s, u]) => `<tr><td>${s}</td><td>${u}</td><td>${inr(topS[s])}</td></tr>`).join('');
  const skuOf = {}; D.orders.forEach(o => skuOf[o.itemId] = o.sku);
  const ret = grp(R, r => r.sku || skuOf[r.itemId] || '—');
  $('tRet').innerHTML = '<tr><th>SKU</th><th>Returns</th><th>Sold</th></tr>' + Object.entries(ret).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([s, n]) => `<tr><td>${s}</td><td>${n}</td><td>${top[s] || 0}</td></tr>`).join('');
  const rs = Object.entries(grp(R, 'reason')).sort((a, b) => b[1] - a[1]).slice(0, 8);
  chart('cReason', { type: 'bar', data: { labels: rs.map(r => r[0]), datasets: [{ data: rs.map(r => r[1]), backgroundColor: '#f7b500' }] }, options: { indexAxis: 'y', plugins: { legend: { display: false } } } });
  $('tApi').innerHTML = '<tr><th>Account</th><th>Status</th></tr>' + D.status.map(s => `<tr><td>${short(s.acc)}</td><td class="${s.ok ? 'ok' : 'bad'}">${s.ok ? '✔ ' : '✖ '}${s.msg}</td></tr>`).join('');
}
function renderSettle() {
  const S = window.FK_SETTLE; if (!S) return;
  $('settle').hidden = false;
  const a = $('fAcc').value, keys = Object.keys(S).filter(k => !a || k === a).sort();
  const dates = keys.flatMap(k => S[k].p.map(p => p[0])).sort();
  $('sNote').textContent = `Seller Hub se liya gaya (${window.FK_SETTLE_AT}) · payment dates ${dates[0] || ''} → ${dates.at(-1) || ''} · date filter yahan lagu nahi hota`;
  const T = (k, typ, f) => (S[k].t[typ] || {})[f] || 0, sum = f => keys.reduce((s, k) => s + f(k), 0);
  const bank = sum(k => S[k].p.reduce((s, p) => s + p[1], 0));
  const fees = sum(k => Object.values(S[k].t).reduce((s, t) => s + t.fees, 0));
  const taxes = sum(k => Object.values(S[k].t).reduce((s, t) => s + t.taxes, 0));
  const retChg = sum(k => T(k, 'Return', 'fees') + T(k, 'Return', 'taxes'));
  const retLoss = sum(k => T(k, 'Return', 'settle'));
  const retN = sum(k => T(k, 'Return', 'n'));
  $('sKpis').innerHTML = [['Bank me aaya', inr(bank)], ['Flipkart Fees', inr(-fees)], ['Taxes (TCS/TDS/GST)', inr(-taxes)],
    ['Return Charges', inr(-retChg)], ['Return se kul nuksaan', inr(-retLoss)], ['Returns settled', retN]]
    .map(([l, v]) => `<div class="k"><span>${l}</span><b>${v}</b></div>`).join('');
  const byDay = {}; keys.forEach(k => S[k].p.forEach(p => byDay[p[0]] = (byDay[p[0]] || 0) + p[1]));
  const d = Object.keys(byDay).sort();
  chart('cBank', { type: 'bar', data: { labels: d, datasets: [{ data: d.map(x => byDay[x]), backgroundColor: '#1f9d55' }] }, options: { plugins: { legend: { display: false } } } });
  $('tSet').innerHTML = '<tr><th>Account</th><th>Bank me</th><th>Fees</th><th>Return chg</th><th>Return loss</th></tr>' +
    keys.map(k => ({ k, b: S[k].p.reduce((s, p) => s + p[1], 0), f: Object.values(S[k].t).reduce((s, t) => s + t.fees + t.taxes, 0), rc: T(k, 'Return', 'fees') + T(k, 'Return', 'taxes'), rl: T(k, 'Return', 'settle') }))
      .sort((x, y) => y.b - x.b).map(r => `<tr><td>${short(r.k)}</td><td>${inr(r.b)}</td><td class="bad">${inr(-r.f)}</td><td class="bad">${inr(-r.rc)}</td><td class="bad">${inr(-r.rl)}</td></tr>`).join('');
  const sk = keys.flatMap(k => S[k].s.map(s => [k, ...s])).filter(s => s[9] < 0).sort((x, y) => x[9] - y[9]).slice(0, 15);
  $('tLoss').innerHTML = '<tr><th>SKU</th><th>Account</th><th>Sold</th><th>Returns</th><th>Return chg</th><th>Net settle</th></tr>' +
    sk.map(s => `<tr><td>${s[1]}</td><td>${short(s[0])}</td><td>${s[7]}</td><td>${s[8]}</td><td class="bad">${inr(-s[9])}</td><td class="${s[6] < 0 ? 'bad' : ''}">${inr(s[6])}</td></tr>`).join('');
}
function makeDemo() {
  const o = [], r = [], st = ['DELIVERED','SHIPPED','READY_TO_DISPATCH','CANCELLED'], rs = ['Size issue','Damaged','Not as described','Changed mind'];
  for (let i = 0; i < 900; i++) { const acc = 'Account' + (1 + i % 9), d = new Date(Date.now() - Math.random() * 30 * 864e5).toISOString().slice(0, 10), sku = 'SKU-' + (100 + Math.floor(Math.random() * 25));
    o.push({ acc, orderId: 'OD' + i, itemId: 'I' + i, date: d, sku, qty: 1 + (Math.random() < .2), amount: 300 + Math.random() * 1500, status: st[Math.random() < .08 ? 3 : Math.floor(Math.random() * 3)] });
    if (Math.random() < .1) r.push({ acc, itemId: 'I' + i, date: d, sku, type: Math.random() < .6 ? 'customer_return' : 'courier_return', reason: rs[Math.floor(Math.random() * 4)] }); }
  return { generated: new Date().toISOString().slice(0, 16).replace('T', ' '), orders: o, returns: r, status: Array.from({ length: 9 }, (_, i) => ({ acc: 'Account' + (i + 1), ok: true, msg: 'demo' })) };
}
render(); renderSettle();
$('fAcc').addEventListener('change', renderSettle);
</script></body></html>
